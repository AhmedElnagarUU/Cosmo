name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://cosmo_app:cosmo_app@localhost:5432/cosmo_test
      TEST_MIGRATION_DATABASE_URL: postgres://cosmo_owner:cosmo_owner@localhost:5432/cosmo_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create database roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE cosmo_owner LOGIN PASSWORD 'cosmo_owner'"
          psql -h localhost -U postgres -c "CREATE ROLE cosmo_app LOGIN PASSWORD 'cosmo_app'"
          psql -h localhost -U postgres -c "CREATE DATABASE cosmo_test OWNER cosmo_owner"
          psql -h localhost -U postgres -d cosmo_test -c "ALTER SCHEMA public OWNER TO cosmo_owner"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
