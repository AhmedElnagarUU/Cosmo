# Local PostgreSQL for development. Start with: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cosmo_owner
      POSTGRES_PASSWORD: cosmo_owner
      POSTGRES_DB: cosmo
    ports:
      - "5432:5432"
    volumes:
      - cosmo-db:/var/lib/postgresql/data
      - ./apps/api/db-init:/docker-entrypoint-initdb.d:ro
volumes:
  cosmo-db:
